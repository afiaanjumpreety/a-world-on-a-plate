<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A World on a Plate</title>
    <meta
      name="description"
      content="An atlas of dishes that travelled: where they began, how each country made them its own, and how to cook every version."
    />
    <meta name="theme-color" content="#FBF7EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1830" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preload" href="/src/assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('wop-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
